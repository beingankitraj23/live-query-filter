<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Catalog · Live Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef3; --surface:#fff; --ink:#121c2b; --muted:#5a6778; --line:#cbd4df; --accent:#1f4bff;
  --Analytics:#0e7c86; --Development:#5b3fd0; --Security:#c2410c; --Design:#b4236b;
  --head:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.shell{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
h1{font:700 clamp(2rem,5vw,3.25rem)/1 var(--head);letter-spacing:-.02em;margin:0}
.tally{font:700 clamp(2rem,5vw,3.25rem)/1 var(--head);color:var(--accent);margin:0;text-align:right}
.tally small{display:block;font:500 .9rem/1.3 var(--body);color:var(--muted)}

.layout{display:grid;grid-template-columns:260px 1fr;gap:1.5rem;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

aside.filters{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem;position:sticky;top:1rem}
@media(max-width:820px){aside.filters{position:static}}
.search{position:relative}
.search input{width:100%;padding:.7rem 2.4rem .7rem .8rem;border:1.5px solid var(--ink);border-radius:4px;background:#fff}
.search button{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);border:0;background:none;width:2rem;height:2rem;cursor:pointer;color:var(--muted);font-size:1.2rem;display:none}
.search.has-text button{display:block}
fieldset{border:0;margin:1.25rem 0 0;padding:0}
legend{font:700 1rem var(--head);padding:0;margin-bottom:.4rem}
.opt{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;cursor:pointer}
.opt input{width:1.1rem;height:1.1rem;accent-color:var(--accent);margin:0}
.opt .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--c,var(--muted))}
.opt .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.opt.zero{opacity:.55}
.clear{margin-top:1rem;width:100%;padding:.55rem;border:1px solid var(--line);background:none;border-radius:4px;cursor:pointer}
.clear:hover{border-color:var(--ink)}
.net{margin-top:1.25rem;padding-top:1rem;border-top:1px dashed var(--line);font-size:.85rem;color:var(--muted)}
.net b{color:var(--ink);font-variant-numeric:tabular-nums}
.net code{display:block;margin-top:.4rem;word-break:break-all;font-size:.78rem;background:var(--bg);padding:.4rem;border-radius:4px;color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.bar .count{font-weight:600}
.bar .ctl{display:flex;gap:.75rem;flex-wrap:wrap}
.bar label{font-size:.9rem;color:var(--muted);display:flex;gap:.4rem;align-items:center}
select{padding:.35rem .5rem;border:1px solid var(--line);border-radius:4px;background:#fff}
.progress{height:3px;background:transparent;margin-bottom:.75rem;overflow:hidden;border-radius:2px}
.progress.on{background:var(--line)}
.progress.on::after{content:"";display:block;height:100%;width:35%;background:var(--accent);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;transition:opacity .15s}
.grid.stale{opacity:.45;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:4px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.card .cat{font-size:.85rem;font-weight:600;color:var(--c)}
.card h2{font:700 1.15rem/1.25 var(--head);margin:0}
mark{background:#ffe36e;color:inherit;padding:0 .1em;border-radius:2px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.pips{display:inline-flex;gap:3px;margin-right:.4rem;vertical-align:middle}
.pips i{width:.6rem;height:.6rem;border:1.5px solid var(--ink);display:block}
.pips i.f{background:var(--ink)}
.dur{height:.5rem;background:var(--bg);border-radius:1px;overflow:hidden}
.dur span{display:block;height:100%;background:var(--c)}
.dur-l{display:flex;justify-content:space-between;font-size:.85rem;margin-top:.25rem}
.rating{font-weight:600;color:var(--ink)}

.skel{border-left-color:var(--line)}
.skel div{background:linear-gradient(90deg,#e4e9ef 25%,#f1f4f7 50%,#e4e9ef 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:3px}
@keyframes sh{to{background-position:-200% 0}}

.state{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:2.5rem 1rem;text-align:center}
.state h2{font:700 1.4rem var(--head);margin:0 0 .4rem}
.state button{margin-top:.8rem;padding:.55rem 1rem;border:1.5px solid var(--ink);background:none;border-radius:4px;cursor:pointer}

nav.pager{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-top:1.5rem}
nav.pager button{min-width:2.5rem;height:2.5rem;padding:0 .7rem;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
nav.pager button:hover:not(:disabled){border-color:var(--ink)}
nav.pager button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
nav.pager button:disabled{opacity:.4;cursor:default}
nav.pager .gap{align-self:center;color:var(--muted);padding:0 .2rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Learning catalog</h1>
    <p class="tally" aria-live="polite"><span id="tally">–</span><small id="tallyLabel">matching resources</small></p>
  </header>

  <div class="layout">
    <aside class="filters" aria-label="Filters">
      <div class="search" id="searchWrap">
        <label class="sr" for="q">Search resources</label>
        <input id="q" type="search" placeholder="Search title, category, level" autocomplete="off">
        <button type="button" id="qClear" aria-label="Clear search">×</button>
      </div>

      <fieldset id="catSet"><legend>Category</legend><div id="cats"></div></fieldset>
      <fieldset id="lvlSet"><legend>Level</legend><div id="lvls"></div></fieldset>
      <button class="clear" id="clearAll" type="button">Reset filters</button>

      <div class="net" aria-live="off">
        Keystrokes <b id="keys">0</b> · Requests sent <b id="reqs">0</b>
        <code id="lastUrl">no request yet</code>
      </div>
    </aside>

    <main>
      <div class="bar">
        <div class="count" id="count" aria-live="polite"></div>
        <div class="ctl">
          <label>Sort
            <select id="sort">
              <option value="default">Catalog order</option>
              <option value="rating">Top rated</option>
              <option value="shortest">Shortest first</option>
              <option value="longest">Longest first</option>
            </select>
          </label>
          <label>Per page
            <select id="limit"><option>6</option><option selected>12</option><option>24</option><option>48</option></select>
          </label>
        </div>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-label="Loading results" aria-hidden="true"></div>
      <section class="grid" id="grid" aria-busy="false"></section>
      <nav class="pager" id="pager" aria-label="Pagination"></nav>
    </main>
  </div>
</div>

<script>
(() => {
  const DEBOUNCE_MS = 350;
  const LEVEL_PIPS = { Beginner: 1, Intermediate: 2, Advanced: 3 };
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  const state = { q: '', cats: new Set(), lvls: new Set(), page: 1, limit: 12, sort: 'default' };
  let keystrokes = 0, requests = 0, ctrl = null, timer = null, hasLoaded = false, facetsBuilt = false;

  // ---------- URL <-> state ----------
  function readUrl() {
    const p = new URLSearchParams(location.search);
    state.q = p.get('search') || '';
    state.cats = new Set((p.get('category') || '').split(',').filter(Boolean));
    state.lvls = new Set((p.get('level') || '').split(',').filter(Boolean));
    state.page = Math.max(1, parseInt(p.get('page'), 10) || 1);
    state.limit = [6, 12, 24, 48].includes(+p.get('limit')) ? +p.get('limit') : 12;
    state.sort = p.get('sort') || 'default';
    $('#q').value = state.q; $('#sort').value = state.sort; $('#limit').value = state.limit;
    $('#searchWrap').classList.toggle('has-text', !!state.q);
  }
  function query() {
    const p = new URLSearchParams();
    if (state.q.trim()) p.set('search', state.q.trim());
    if (state.cats.size) p.set('category', [...state.cats].join(','));
    if (state.lvls.size) p.set('level', [...state.lvls].join(','));
    if (state.sort !== 'default') p.set('sort', state.sort);
    p.set('page', state.page); p.set('limit', state.limit);
    return p.toString();
  }

  // ---------- data loading ----------
  async function load() {
    if (ctrl) ctrl.abort();            // cancel stale in-flight request
    ctrl = new AbortController();
    const qs = query();
    history.replaceState(null, '', '?' + qs);
    setLoading(true);
    try {
      requests++; $('#reqs').textContent = requests; $('#lastUrl').textContent = '/api/search?' + qs;
      const res = await fetch('/api/search?' + qs, { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      state.page = json.meta.page;
      hasLoaded = true;
      render(json);
      setLoading(false);
    } catch (err) {
      if (err.name === 'AbortError') return;   // a newer request is in flight
      setLoading(false);
      renderError();
    }
  }
  const schedule = () => { clearTimeout(timer); timer = setTimeout(load, DEBOUNCE_MS); };

  // ---------- rendering ----------
  function setLoading(on) {
    const grid = $('#grid');
    grid.setAttribute('aria-busy', on);
    $('#progress').classList.toggle('on', on);
    if (!on) { grid.classList.remove('stale'); return; }
    if (!hasLoaded) renderSkeletons(); else grid.classList.add('stale');
  }
  function renderSkeletons() {
    const grid = $('#grid'); grid.replaceChildren();
    for (let i = 0; i < state.limit; i++) {
      const c = el('article', 'card skel');
      [['1rem', '40%'], ['1.4rem', '85%'], ['1rem', '60%'], ['.5rem', '100%']].forEach(([h, w]) => {
        const d = el('div'); d.style.height = h; d.style.width = w; c.append(d);
      });
      grid.append(c);
    }
  }
  function buildFacet(container, group, names, facetCounts) {
    container.replaceChildren();
    names.forEach((name) => {
      const lab = el('label', 'opt'); lab.dataset.name = name;
      if (group === 'cats') lab.style.setProperty('--c', `var(--${name}, var(--muted))`);
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = state[group].has(name);
      cb.addEventListener('change', () => {
        cb.checked ? state[group].add(name) : state[group].delete(name);
        state.page = 1; load();     // checkbox changes are discrete: no debounce
      });
      lab.append(cb);
      if (group === 'cats') lab.append(el('span', 'dot'));
      lab.append(el('span', null, name), el('span', 'n', facetCounts[name] ?? 0));
      container.append(lab);
    });
  }
  function updateCounts(container, facetCounts) {
    container.querySelectorAll('.opt').forEach((lab) => {
      const n = facetCounts[lab.dataset.name] ?? 0;
      lab.querySelector('.n').textContent = n;
      lab.classList.toggle('zero', n === 0 && !lab.querySelector('input').checked);
    });
  }
  function highlight(node, text, term) {
    const tokens = term.toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.length) { node.textContent = text; return; }
    const re = new RegExp('(' + tokens.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
    text.split(re).forEach((part, i) => {
      if (i % 2) node.append(el('mark', null, part)); else if (part) node.append(document.createTextNode(part));
    });
  }
  const fmtDur = (m) => { const h = Math.floor(m / 60), r = m % 60; return [h ? h + 'h' : '', r ? r + 'm' : ''].filter(Boolean).join(' ') || '0m'; };

  function card(item) {
    const c = el('article', 'card'); c.style.setProperty('--c', `var(--${item.category}, var(--muted))`);
    const h = el('h2'); highlight(h, item.title, state.q);
    const cat = el('div', 'cat'); highlight(cat, item.category, state.q);

    const meta = el('div', 'meta');
    const lvl = el('span'); const pips = el('span', 'pips'); pips.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 3; i++) pips.append(el('i', i < LEVEL_PIPS[item.level] ? 'f' : ''));
    lvl.append(pips, document.createTextNode(item.level));
    meta.append(lvl, el('span', 'rating', '★ ' + item.rating.toFixed(1)));

    const dur = el('div', 'dur'); const fill = el('span'); fill.style.width = Math.round((item.durationMinutes / 240) * 100) + '%'; dur.append(fill);
    const dl = el('div', 'dur-l'); dl.append(el('span', null, fmtDur(item.durationMinutes)), el('span', null, 'duration'));
    dl.lastChild.style.color = 'var(--muted)';

    c.append(cat, h, meta, dur, dl);
    return c;
  }
  function render({ data, meta, facets }) {
    if (!facetsBuilt) {
      buildFacet($('#cats'), 'cats', Object.keys(facets.category), facets.category);
      buildFacet($('#lvls'), 'lvls', Object.keys(facets.level), facets.level);
      facetsBuilt = true;
    }
    updateCounts($('#cats'), facets.category); updateCounts($('#lvls'), facets.level);

    $('#tally').textContent = meta.total;
    $('#tallyLabel').textContent = meta.total === 1 ? 'matching resource' : 'matching resources';
    const from = meta.total ? (meta.page - 1) * meta.limit + 1 : 0;
    $('#count').textContent = meta.total ? `Showing ${from}–${from + data.length - 1} of ${meta.total}` : 'No results';

    const grid = $('#grid'); grid.replaceChildren();
    if (!data.length) {
      const s = el('div', 'state');
      s.append(el('h2', null, 'Nothing matches those filters'), el('p', null, 'Try a shorter search term or remove a category.'));
      const b = el('button', null, 'Reset filters'); b.type = 'button'; b.addEventListener('click', resetAll); s.append(b);
      grid.append(s);
    } else data.forEach((i) => grid.append(card(i)));
    renderPager(meta);
  }
  function renderError() {
    const grid = $('#grid'); grid.replaceChildren();
    const s = el('div', 'state'); s.setAttribute('role', 'alert');
    s.append(el('h2', null, 'Could not load results'), el('p', null, 'The search request failed. Check your connection and try again.'));
    const b = el('button', null, 'Retry'); b.type = 'button'; b.addEventListener('click', load); s.append(b);
    grid.append(s); $('#pager').replaceChildren();
  }
  function renderPager({ page, totalPages }) {
    const nav = $('#pager'); nav.replaceChildren();
    if (totalPages <= 1) return;
    const btn = (label, target, opts = {}) => {
      const b = el('button', null, label); b.type = 'button';
      if (opts.aria) b.setAttribute('aria-label', opts.aria);
      if (opts.disabled) b.disabled = true;
      if (target === page && !opts.nav) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', () => goTo(target));
      return b;
    };
    nav.append(btn('Prev', page - 1, { nav: true, disabled: page === 1, aria: 'Previous page' }));
    const pages = new Set([1, totalPages, page - 1, page, page + 1].filter((n) => n >= 1 && n <= totalPages));
    let prev = 0;
    [...pages].sort((a, b) => a - b).forEach((n) => {
      if (n - prev > 1) nav.append(el('span', 'gap', '…'));
      nav.append(btn(String(n), n, { aria: 'Page ' + n })); prev = n;
    });
    nav.append(btn('Next', page + 1, { nav: true, disabled: page === totalPages, aria: 'Next page' }));
  }
  function goTo(p) {
    state.page = p; load();
    $('.bar').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  function resetAll() {
    clearTimeout(timer);
    Object.assign(state, { q: '', page: 1, sort: 'default' }); state.cats.clear(); state.lvls.clear();
    $('#q').value = ''; $('#sort').value = 'default'; $('#searchWrap').classList.remove('has-text');
    document.querySelectorAll('.opt input').forEach((c) => (c.checked = false));
    load();
  }

  // ---------- events ----------
  $('#q').addEventListener('input', (e) => {
    keystrokes++; $('#keys').textContent = keystrokes;
    state.q = e.target.value; state.page = 1;
    $('#searchWrap').classList.toggle('has-text', !!state.q);
    schedule();                                   // debounced
  });
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(timer); load(); } });
  $('#qClear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; state.page = 1; $('#searchWrap').classList.remove('has-text'); clearTimeout(timer); load(); $('#q').focus(); });
  $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; state.page = 1; load(); });
  $('#limit').addEventListener('change', (e) => { state.limit = +e.target.value; state.page = 1; load(); });
  $('#clearAll').addEventListener('click', resetAll);
  addEventListener('popstate', () => { readUrl(); facetsBuilt = false; load(); });

  readUrl();
  load();
})();
</script>
</body>
</html>
